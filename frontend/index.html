<!DOCTYPE html>
<html lang="sw">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1923" />
    <!-- FIX (installable PWA with shop branding): these three now point at
         backend endpoints that render live from Settings (shop name +
         logo), instead of the static /manifest.json with no icons at all
         (which also meant Chrome/Edge often wouldn't even offer "Install
         app" — a manifest needs at least one usable icon to qualify). -->
    <link rel="manifest" href="/api/manifest.webmanifest" />
    <link rel="icon" href="/api/manifest-icon?size=48" />
    <link rel="apple-touch-icon" href="/api/manifest-icon?size=180" />
    <!-- iOS Safari doesn't read the manifest for "Add to Home Screen" —
         it needs these instead to launch full-screen without browser chrome. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MotoShop" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet" />
    <title>MotoShop</title>
    <script>
      // Runs before any CSS paints, so the correct theme applies immediately
      // on load/refresh instead of flashing dark before React mounts and
      // AppContext applies the saved/preferred theme.
      (function () {
        try {
          var saved = localStorage.getItem('motoshop_theme');
          var theme = (saved === 'light' || saved === 'dark')
            ? saved
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {})
        })
      }
    </script>
  </body>
</html>
